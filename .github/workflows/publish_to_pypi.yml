name: Publish to PyPI

# Manual workflow (B of 2): tag the released version on the default branch,
# build wheels, run the test gate, and publish to PyPI via OIDC Trusted
# Publishing. Run "Version Bump" first and merge its PR, then run this with the
# same version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must already be merged to the default branch), e.g. 0.2.0"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and run every test tier at the dispatched commit; no tag, no publish"
        required: false
        type: boolean
        default: false

permissions: {}

# Release builds read no Actions cache (no rust-cache, setup-uv cache or
# sccache): admin-dispatched parity-tests.yml runs execute PR code in master's
# cache scope, so anything they can write must never feed a published wheel.

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version files match the requested version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # An existing tag is authoritative: the files at the dispatched
          # commit may legitimately differ from a tag cut earlier.
          if [ "$DRY_RUN" != "true" ] && git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; skipping the version-file check."
            exit 0
          fi
          FILE_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PY_VER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$FILE_VER" != "$VERSION" ] || [ "$PY_VER" != "$VERSION" ]; then
            echo "::error::Version mismatch on ${GITHUB_REF_NAME}: Cargo.toml=${FILE_VER} pyproject.toml=${PY_VER} but requested ${VERSION}. Merge the Version Bump PR first."
            exit 1
          fi
      - name: Ensure the tag exists for this version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; using it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          echo "Created and pushed tag ${VERSION}."
      - id: ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  test-rust:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # The runner's python3 has no shared libpython to link; setup-python's does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # extension-module makes PyO3 skip linking libpython; build tests without
      # it so the standalone test binary links libpython, and expose LIBDIR.
      - name: cargo test
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH:-}"
          cargo test --no-default-features

  test-python:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install VCF command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix
      - name: Build and test
        run: |
          uv python install 3.12
          uv sync --python 3.12
          uv run pytest -v

  sdist:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Wheels build with `--profile dist` (fat LTO, one codegen unit; see
  # Cargo.toml). Its single-threaded final link peaked at 16.2 GB RSS on macOS
  # arm64, more than GitHub's 16 GB Linux runners can be trusted to hold.
  # - x86_64 builds on the org's self-hosted hosts (10 vCPU, 25 GB RAM, 64 GB
  #   swap).
  # - aarch64 builds natively on GitHub's arm64 runner, with a swapfile added
  #   for the link. It cannot be cross-compiled on the self-hosted hosts:
  #   rust-cross/manylinux2014-cross:aarch64 ships gcc 4.8, and libdeflate-sys
  #   needs >= 4.9 and arm_acle.h. The manylinux_2_28 cross image would raise
  #   the wheel's glibc floor from 2.17 to 2.28.
  #
  # The self-hosted hosts also run /parity-wgs. Its PR code only runs in a
  # locked-down container (no Docker socket), but host state persists between
  # jobs, and maturin-action reuses any local image carrying the requested tag
  # without pulling. The build images are therefore pinned by digest, which
  # only the registry's content can satisfy. Bump a digest by resolving the tag
  # that maturin-action's `manylinux: auto` picks: quay.io/pypa/manylinux2014_<arch>:latest.
  # The build container is `--rm` and installs Rust itself, so no CARGO_HOME
  # carries over.
  linux:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      # One target's failure must not cancel the other's measurement.
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: [self-hosted, linux, x64, vepyr-wgs]
            timeout: 120
            container: quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423
          - target: aarch64
            runner: ubuntu-24.04-arm
            timeout: 300
            container: quay.io/pypa/manylinux2014_aarch64@sha256:c2995cae5e2d433fbe757d1466486727b3edd68ba644cd60df253365f35fda9e
    steps:
      - name: Clean leftovers from earlier jobs
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: Add swap for the fat-LTO link (GitHub-hosted only)
        if: matrix.target == 'aarch64'
        run: |
          set -euo pipefail
          free -g; df -h /
          # Leave 15 GiB of the root disk for the build; swap gets the rest, up to 32 GiB.
          avail=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          size=$(( avail - 15 )); [ "$size" -gt 32 ] && size=32
          [ "$size" -ge 8 ] || { echo "::error::only ${avail} GiB free on /, cannot add swap"; exit 1; }
          sudo fallocate -l "${size}G" /swapfile-lto
          sudo chmod 600 /swapfile-lto
          sudo mkswap /swapfile-lto
          sudo swapon /swapfile-lto
          free -g
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Note swap counters before the build
        run: echo "PSWPOUT_BEFORE=$(awk '/^pswpout/ {print $2}' /proc/vmstat)" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
          args: --profile dist --out dist --find-interpreter
          sccache: false
          manylinux: auto
      - name: Report whether the build swapped
        if: always()
        run: |
          # Pages swapped out host-wide while the build ran: non-zero means the
          # link outgrew the host's RAM, which the next host sizing should
          # account for. A runner takes one job at a time, so other processes
          # on the host contribute little, but the counter is not per-job.
          after=$(awk '/^pswpout/ {print $2}' /proc/vmstat)
          pages=$(( after - ${PSWPOUT_BEFORE:-$after} ))
          echo "Swapped out host-wide during the build: ${pages} pages ($(( pages * 4 / 1024 )) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 1 -type f -printf '%s bytes  %f\n' | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist

  # No test tier runs the aarch64 wheel (they all take x86_64), so load the
  # fat-LTO build on arm64 before it can be published.
  linux-aarch64-import:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          sparse-checkout: tests/test_import.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the wheel and run the import tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/vepyr-*manylinux*aarch64*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one aarch64 wheel, got ${#wheels[@]}"; exit 1; }
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "${wheels[0]}" pytest
          cd /tmp && /tmp/venv/bin/python -m pytest -v "$GITHUB_WORKSPACE/tests/test_import.py"

  macos:
    needs: prepare
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-latest' || 'macos-15' }}
    # Both macOS images are arm64 runners with 7 GB RAM; the 16 GB fat-LTO link
    # swaps there. polars-bio's 9 GB link took 2-3 hours on them, so allow the
    # hosted maximum.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile dist --out dist --find-interpreter
          sccache: false
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: v1.13.3
          args: --profile dist --out dist --find-interpreter
          sccache: false
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win-${{ matrix.target }}
          path: dist

  tier-vep-parity:
    needs: [prepare, linux]
    permissions:
      contents: read
    uses: ./.github/workflows/_tier-vep-parity.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  tier-integration:
    needs: [prepare, linux]
    permissions:
      contents: read
    uses: ./.github/workflows/_tier-integration.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  tier-nfcore:
    needs: [prepare, linux]
    permissions:
      contents: read
    uses: ./.github/workflows/_tier-nfcore.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    name: Publish to PyPI
    if: ${{ !inputs.dry_run }}
    needs: [prepare, test-rust, test-python, sdist, linux, linux-aarch64-import, macos, windows, tier-vep-parity, tier-integration, tier-nfcore]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-sdist
          path: dist-in/wheels-sdist
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: dist-in/wheels-manylinux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist-in/wheels-manylinux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist-in/wheels-macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist-in/wheels-macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-win-x64
          path: dist-in/wheels-win-x64
      # Exactly the named build artifacts, nothing else: one sdist plus at
      # least one wheel per platform, every file named for this version.
      - name: Assemble and check dist/
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          mkdir -p dist
          for name in wheels-sdist wheels-manylinux-x86_64 wheels-manylinux-aarch64 wheels-macos-x86_64 wheels-macos-aarch64 wheels-win-x64; do
            files=(dist-in/"$name"/*)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::artifact $name is empty"; exit 1; }
            if [ "$name" = wheels-sdist ] && [ "${#files[@]}" -ne 1 ]; then
              echo "::error::wheels-sdist holds ${#files[@]} files, expected 1"; exit 1
            fi
            for f in "${files[@]}"; do
              base=$(basename "$f")
              if [ ! -f "$f" ] || [ -L "$f" ]; then
                echo "::error::$name/$base is not a regular file"; exit 1
              fi
              if [ "$name" = wheels-sdist ]; then
                [ "$base" = "vepyr-${VERSION}.tar.gz" ] || { echo "::error::unexpected sdist $base"; exit 1; }
              else
                case "$base" in
                  "vepyr-${VERSION}-"*.whl) ;;
                  *) echo "::error::unexpected file $name/$base"; exit 1 ;;
                esac
              fi
              [ ! -e "dist/$base" ] || { echo "::error::duplicate file $base"; exit 1; }
              mv "$f" dist/
            done
          done
          ls -l dist
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-sdist
          path: dist-in/wheels-sdist
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: dist-in/wheels-manylinux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist-in/wheels-manylinux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist-in/wheels-macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist-in/wheels-macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: wheels-win-x64
          path: dist-in/wheels-win-x64
      # Exactly the named build artifacts, nothing else: one sdist plus at
      # least one wheel per platform, every file named for this version.
      - name: Assemble and check dist/
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          mkdir -p dist
          for name in wheels-sdist wheels-manylinux-x86_64 wheels-manylinux-aarch64 wheels-macos-x86_64 wheels-macos-aarch64 wheels-win-x64; do
            files=(dist-in/"$name"/*)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::artifact $name is empty"; exit 1; }
            if [ "$name" = wheels-sdist ] && [ "${#files[@]}" -ne 1 ]; then
              echo "::error::wheels-sdist holds ${#files[@]} files, expected 1"; exit 1
            fi
            for f in "${files[@]}"; do
              base=$(basename "$f")
              if [ ! -f "$f" ] || [ -L "$f" ]; then
                echo "::error::$name/$base is not a regular file"; exit 1
              fi
              if [ "$name" = wheels-sdist ]; then
                [ "$base" = "vepyr-${VERSION}.tar.gz" ] || { echo "::error::unexpected sdist $base"; exit 1; }
              else
                case "$base" in
                  "vepyr-${VERSION}-"*.whl) ;;
                  *) echo "::error::unexpected file $name/$base"; exit 1 ;;
                esac
              fi
              [ ! -e "dist/$base" ] || { echo "::error::duplicate file $base"; exit 1; }
              mv "$f" dist/
            done
          done
          ls -l dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes
          fi
