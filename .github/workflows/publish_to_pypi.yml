name: Publish to PyPI

# One-off, throwaway branch: add the Linux aarch64 wheel to the already
# released 0.7.0. The filename stays publish_to_pypi.yml because PyPI's trusted
# publisher is bound to it. Builds only that wheel from the 0.7.0 tag, gates on
# the test suite run on arm64 at the same tag, uploads the one file with
# skip-existing, and attaches it to the GitHub Release without clobbering the
# existing assets. Not meant to be merged.

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: "0.7.0"

jobs:
  test-linux-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Install VCF command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix
      # The tag's dev group still lists polars-bio, which has no aarch64 wheel
      # and nothing in the suite calls. Drop it rather than compile it.
      - name: Build and test
        run: |
          uv python install 3.12
          uv remove --group dev polars-bio --no-sync
          uv sync --python 3.12
          uv run pytest -v

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: auto
      - name: Check exactly one aarch64 manylinux wheel for the tag
        run: |
          set -euo pipefail
          ls -l dist
          n=$(ls dist/vepyr-${RELEASE_TAG}-*manylinux*_aarch64.whl | wc -l)
          total=$(ls dist | wc -l)
          if [ "$n" -ne 1 ] || [ "$total" -ne 1 ]; then
            echo "::error::expected exactly one vepyr-${RELEASE_TAG} manylinux aarch64 wheel, got $n of $total files"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist

  publish:
    name: Publish to PyPI
    needs: [test-linux-arm64, linux-aarch64]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-aarch64
          path: dist
      - name: Attach the wheel to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --repo "$GITHUB_REPOSITORY"
