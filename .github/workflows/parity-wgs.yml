name: Parity tests (whole genome)

# Admin-only whole-genome md5 parity (HG002, VEP 116, profiles in
# e2e-testing/golden/wgs-manifest.json) on the self-hosted runner.
#   gh workflow run parity-wgs.yml -f pr=123
#   a PR comment that is exactly `/parity-wgs`
# issue_comment always runs the default branch's copy of this workflow.
# PR code runs only inside a fresh `docker run` of the locally built image,
# with the staged data mounted read-only. See ci/wgs-runner/README.md.
# The SHA is resolved once by `authorize`; a push during the run leaves the new
# head without a status until an admin re-runs this.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {}

env:
  WGS_IMAGE: vepyr-wgs:1

jobs:
  # Exact command check, separate from authorize so that a non-command comment
  # ends here with every later job skipped. Runs master's helper only: for
  # issue_comment the ref is always the default branch.
  command:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/parity-wgs'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] \
            || python3 ci/ci_helpers.py is-parity-wgs-command --env COMMENT_BODY; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Comment is not exactly /parity-wgs; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

  authorize:
    needs: command
    if: needs.command.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Master's own helper and manifest (sparse checkout below), never the PR.
      contents: read
      statuses: write
      # Read the PR; for a /parity-wgs comment, also reply (pull-requests) and
      # react on the comment (issue comment reactions need issues: write).
      pull-requests: write
      issues: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      profiles: ${{ steps.profiles.outputs.profiles }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr || github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Only master's workflow may run this
        run: |
          # Dispatching from a branch would run that branch's workflow and helper.
          [ "$REF" = "refs/heads/master" ] || { echo "::error::dispatch from master, not $REF"; exit 1; }
      - id: admin
        name: Only admins may run this
        run: |
          # A re-run keeps github.actor as the original dispatcher, so check
          # both. "Re-run all jobs" re-runs this job, so triggering_actor must be
          # an admin; "Re-run failed jobs" reuses the earlier successful
          # authorize, which is acceptable: an admin already approved that SHA.
          # For a /parity-wgs comment, github.actor is the commenter.
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            perm=$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission)
            if [ "$perm" != "admin" ]; then
              echo "::error::$who has '$perm' permission; parity tests are admin-only"; exit 1
            fi
          done
      - id: pr
        name: Resolve the PR head SHA
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got '$PR'"; exit 1; }
          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          [ "$state" = "open" ] || { echo "::error::PR #$PR is $state"; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing PR #$PR at $sha" >> "$GITHUB_STEP_SUMMARY"
      # The workflow's own ref (master), never the PR: the profile list decides
      # which statuses are required, so a PR must not be able to shrink it.
      # Non-cone patterns keep the golden VCFs next to the manifest out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci/
            /e2e-testing/golden/wgs-manifest.json
          persist-credentials: false
      - id: profiles
        name: Read the profile list from master's manifest
        run: |
          profiles=$(python3 ci/ci_helpers.py profiles e2e-testing/golden/wgs-manifest.json)
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "Profiles: $profiles" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark pending
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context=parity/wgs -f description="running" \
            -f target_url="$url"
      - name: Acknowledge the /parity-wgs comment
        if: github.event_name == 'issue_comment'
        # The run is already authorized and pending; a failed reply must not
        # skip the tests and leave the status pending.
        continue-on-error: true
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="Whole-genome parity started on \`$SHA\` for @$ACTOR: $url"
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket \
            || echo "::warning::reaction failed"
      - name: Refuse a non-admin /parity-wgs comment
        if: failure() && github.event_name == 'issue_comment' && steps.admin.outcome == 'failure'
        run: |
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="@$ACTOR /parity-wgs is admin-only; ask a maintainer to run it."
      - name: Report a /parity-wgs comment that could not start
        if: failure() && github.event_name == 'issue_comment' && steps.admin.outcome == 'success'
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="/parity-wgs could not start; see $url"

  build-wheel:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          # No sccache: a PR build.rs could poison entries in master's cache scope.
          sccache: false
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: dist

  # The only job on the persistent self-hosted runner. It runs no checked-out
  # (PR) code on the host: the wheel is found with a shell glob, the fallback
  # result is written with printf, and the PR's run-profile.sh runs only
  # inside a throwaway, unprivileged container.
  # The host never follows a PR-controlled path: after checkout it neither
  # reads nor writes the workspace (a PR can commit symlinks there), and it
  # reads $SCRATCH (written by PR code in the container) only after purging
  # every non-regular entry, copying size-capped regular files into $RES,
  # a host-created directory outside the workspace that all uploads come from.
  # Serialisation: one runner carries the vepyr-wgs label, so jobs queue FIFO
  # there; max-parallel keeps a run's own profiles in sequence. No workflow
  # concurrency group: GitHub keeps only one pending run per group, so any
  # third request would evict a queued admin run.
  profile:
    needs: [authorize, build-wheel]
    name: wgs (${{ matrix.profile }})
    runs-on: [self-hosted, linux, x64, vepyr-wgs]
    # Measured on gh-runner-bdg-1 (16 vCPU): merged 29, ensembl 23, refseq 21 min.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(needs.authorize.outputs.profiles) }}
    env:
      PROFILE: ${{ matrix.profile }}
      SCRATCH: /scratch/vepyr-wgs/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      CONTAINER: vepyr-wgs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - name: Clean leftovers from earlier jobs
        run: |
          # A job container that outlived a cancelled or timed-out job.
          docker ps -aq --filter label=vepyr-wgs=1 | xargs -r docker rm -f
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
          rm -rf "$SCRATCH" && mkdir -p "$SCRATCH"
          res=$(mktemp -d "$RUNNER_TEMP/wgs-res.XXXXXX")
          echo "RES=$res" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: ${{ env.SCRATCH }}/dist
      - id: run
        name: Whole-genome parity in a fresh container
        run: |
          docker image inspect "$WGS_IMAGE" >/dev/null || { echo "::error::image $WGS_IMAGE missing on runner; run ci/wgs-runner/build-image.sh"; exit 3; }
          # No checked-out (PR) code runs on the host: shell only here. The
          # container has not run yet, so dist/ holds only the downloaded wheel.
          shopt -s nullglob
          wheels=("$SCRATCH"/dist/vepyr-*manylinux*x86_64*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one x86_64 wheel, got ${#wheels[@]}"; exit 3; }
          wheel="${wheels[0]}"
          docker run --rm --name "$CONTAINER" --label vepyr-wgs=1 --network bridge \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --memory 56g --memory-swap 56g \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=4g \
            -e DATA_VEPYR_DIR=/data -e HOME=/work -e WORK=/work \
            -v /data/vepyr:/data:ro -v "$SCRATCH":/work:rw -v "$GITHUB_WORKSPACE":/src:ro \
            "$WGS_IMAGE" bash /src/ci/wgs-runner/run-profile.sh "$PROFILE" "/work/dist/$(basename "$wheel")"
      - name: Collect results
        if: always()
        run: |
          if [ -z "${RES:-}" ] || [ ! -d "$RES" ]; then echo "::error::no host results dir"; exit 1; fi
          fail() {  # host-side error result; $SCRATCH is not read
            printf '{"name":"wgs/%s","conclusion":"error","summary":"%s"}\n' "$PROFILE" "$1" > "$RES/result-wgs-$PROFILE.json"
            echo "::error::$1"; exit 1
          }
          # On cancel or timeout the runner kills the docker CLI, not the
          # container: make sure no PR code is still writing to $SCRATCH.
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          left=$(docker ps -aq --filter "name=^${CONTAINER}\$") || fail "cannot list containers"
          [ -z "$left" ] || fail "job container still present"
          # $SCRATCH was written by PR code: drop symlinks and specials first
          # (twice, around the chmod that undoes any unreadable directories).
          find "$SCRATCH" -mindepth 1 \( -type l -o ! -type f ! -type d \) -delete 2>/dev/null || true
          chmod -R u+rwX "$SCRATCH" 2>/dev/null || true
          find "$SCRATCH" -mindepth 1 \( -type l -o ! -type f ! -type d \) -delete 2>/dev/null || true
          real_scratch=$(realpath -e -- "$SCRATCH") || fail "scratch missing"
          take() {  # take SRC DEST MAXBYTES: copy a capped regular file into $RES
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            local real
            # Defence in depth against a symlinked directory component.
            real=$(realpath -e -- "$1") || return 1
            case "$real" in "$real_scratch"/*) ;; *) return 1 ;; esac
            mkdir -p "$(dirname "$2")" && head -c "$3" -- "$real" > "$2"
          }
          take "$SCRATCH/summary.txt" "$RES/summary.txt" 65536 || true
          take "$SCRATCH/run.log" "$RES/reports/run.log" 5242880 || true
          take "$SCRATCH/result.json" "$RES/result-wgs-$PROFILE.json" 16384 \
            || printf '{"name":"wgs/%s","conclusion":"error","summary":"no result written"}\n' "$PROFILE" > "$RES/result-wgs-$PROFILE.json"
          if [ -f "$RES/summary.txt" ]; then mkdir -p "$RES/reports" && cp -- "$RES/summary.txt" "$RES/reports/summary.txt"; fi
          if [ -d "$SCRATCH/out/reports" ] && [ ! -L "$SCRATCH/out/reports" ]; then
            # At most 200 files, 5 MiB each, 200 MiB in total.
            n=0; budget=$((200 * 1024 * 1024))
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              if [ "$n" -gt 200 ] || [ "$budget" -le 0 ]; then break; fi
              cap=$((budget < 5242880 ? budget : 5242880))
              dest="$RES/reports/out/${f#"$SCRATCH/out/reports/"}"
              take "$f" "$dest" "$cap" || continue
              budget=$((budget - $(stat -c %s -- "$dest")))
            done < <(find "$SCRATCH/out/reports" -type f -print0)
          fi
          { echo "### wgs ($PROFILE)"; cat "$RES/summary.txt" 2>/dev/null || echo "did not run"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-wgs-${{ matrix.profile }}
          path: ${{ env.RES }}/result-wgs-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wgs-${{ matrix.profile }}-reports
          path: ${{ env.RES }}/reports
          if-no-files-found: ignore
      - name: Remove scratch, results and workspace
        if: always()
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          chmod -R u+rwX "$SCRATCH" 2>/dev/null || true
          rm -rf "$SCRATCH" ${RES:+"$RES"}
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true

  report:
    needs: [authorize, profile]
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      # Reply on the PR for a /parity-wgs comment.
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr || github.event.issue.number }}
      SHA: ${{ needs.authorize.outputs.sha }}
      # From master's manifest (authorize); the job result is a fixed enum.
      # Result files come from a job that ran PR code: data only, never
      # interpolated into a script.
      PROFILES: ${{ needs.authorize.outputs.profiles }}
      PROFILE_RESULT: ${{ needs.profile.result }}
    steps:
      # The workflow's own ref (master), never the PR: this job holds statuses: write.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          pattern: result-wgs-*
          path: results
      - name: Post statuses
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          mkdir -p results
          python3 ci/ci_helpers.py wgs-statuses --results-dir results \
            --profiles "$PROFILES" --job "$PROFILE_RESULT" \
            > statuses.tsv
          cat statuses.tsv
          failed=0
          while IFS=$'\t' read -r ctx state desc; do
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$state" -f context="$ctx" -f description="$desc" \
              -f target_url="$url" || failed=1
          done < statuses.tsv
          exit "$failed"
      - name: Reply to the /parity-wgs comment
        if: ${{ !cancelled() && github.event_name == 'issue_comment' }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          want=parity/wgs
          # Descriptions can carry text from a job that ran PR code: keep it
          # inside a code span so it cannot render as markdown or mentions.
          row=$(awk -F'\t' -v c="$want" '$1 == c { print $2 "\t" $3; exit }' statuses.tsv 2>/dev/null || true)
          state=${row%%$'\t'*}
          desc=${row#*$'\t'}
          [ -n "$row" ] || { state=error; desc="no status computed"; }
          body="Whole-genome parity on \`$SHA\`:"
          body+=$'\n'"- \`$want\`: **${state//[^a-z]/}** \`${desc//\`/}\`"
          body+=$'\n\n'"Run: $url"
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body"
