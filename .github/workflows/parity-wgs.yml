name: Parity tests (whole genome)

# Admin-only whole-genome md5 parity (HG002, VEP 116, profiles in
# e2e-testing/golden/wgs-manifest.json) on the self-hosted runner.
#   gh workflow run parity-wgs.yml -f pr=123 [-f sha=<head sha>]
#   a PR comment that is exactly `/parity-wgs` or `/parity-wgs <head sha>`
# A fork PR must pin the head SHA the admin reviewed (7+ hex characters), so a
# push between the comment and `authorize` cannot run unreviewed code on the
# persistent runner. A pinned SHA is enforced for any PR.
# issue_comment always runs the default branch's copy of this workflow.
# PR code runs only inside a fresh `docker run` of the locally built image,
# with the staged data mounted read-only. See ci/wgs-runner/README.md.
# The SHA is resolved once by `authorize`; a push during the run leaves the new
# head without a status until an admin re-runs this.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: Head SHA you reviewed (required for fork PRs; 7+ hex characters)
        required: false
        type: string
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Exact command check, separate from authorize so that a non-command comment
  # ends here with every later job skipped. Runs master's helper only: for
  # issue_comment the ref is always the default branch.
  command:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/parity-wgs'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
      pin: ${{ steps.check.outputs.pin }}
    steps:
      - if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          # The pin is validated (hex, 7-40) again in authorize.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            printf 'pin=%s\n' "${SHA_INPUT//[^0-9A-Za-z]/}" >> "$GITHUB_OUTPUT"
          elif pin=$(python3 ci/ci_helpers.py parity-wgs-pin --env COMMENT_BODY); then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "pin=$pin" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Comment is not exactly /parity-wgs; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

  authorize:
    needs: command
    if: needs.command.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Master's own helper and manifest (sparse checkout below), never the PR.
      contents: read
      statuses: write
      # Read the PR; for a /parity-wgs comment, also reply (pull-requests) and
      # react on the comment (issue comment reactions need issues: write).
      pull-requests: write
      issues: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      profiles: ${{ steps.profiles.outputs.profiles }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr || github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      REF: ${{ github.ref }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      PIN: ${{ needs.command.outputs.pin }}
    steps:
      - name: Only master's workflow may run this
        run: |
          # Dispatching from a branch would run that branch's workflow and helper.
          [ "$REF" = "refs/heads/master" ] || { echo "::error::dispatch from master, not $REF"; exit 1; }
      - id: admin
        name: Only admins may run this
        run: |
          # A re-run keeps github.actor as the original dispatcher, so check
          # both. "Re-run all jobs" re-runs this job, so triggering_actor must be
          # an admin; "Re-run failed jobs" reuses the earlier successful
          # authorize, which is acceptable: an admin already approved that SHA.
          # For a /parity-wgs comment, github.actor is the commenter.
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            perm=$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission)
            if [ "$perm" != "admin" ]; then
              echo "::error::$who has '$perm' permission; parity tests are admin-only"; exit 1
            fi
          done
      - id: pr
        name: Resolve the PR head SHA
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got '$PR'"; exit 1; }
          refuse() {  # message for the reply step, then fail
            printf 'msg=%s\n' "$1" >> "$GITHUB_OUTPUT"; echo "::error::$1"; exit 1
          }
          # One read, so state, head and fork-ness describe the same moment.
          read -r state sha head_repo < <(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.state, .head.sha, (.head.repo.full_name // "deleted")] | @tsv')
          [ "$state" = "open" ] || refuse "PR #$PR is $state"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || refuse "unexpected head SHA"
          # Master's helper is not checked out yet: match the pin in shell.
          pin=${PIN,,}
          if [ -n "$pin" ]; then
            [[ "$pin" =~ ^[0-9a-f]{7,40}$ ]] || refuse "pinned SHA must be 7-40 hex characters"
            [[ "$sha" == "$pin"* ]] \
              || refuse "pinned SHA does not match the PR head \`$sha\` (pushed after review?); re-check and pin the new head"
          elif [ "$head_repo" != "$REPO" ]; then
            refuse "fork PR: pin the head you reviewed with \`/parity-wgs ${sha:0:12}\`"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing PR #$PR at $sha" >> "$GITHUB_STEP_SUMMARY"
      # The workflow's own ref (master), never the PR: the profile list decides
      # which statuses are required, so a PR must not be able to shrink it.
      # Non-cone patterns keep the golden VCFs next to the manifest out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ci/
            /e2e-testing/golden/wgs-manifest.json
          persist-credentials: false
      - id: profiles
        name: Read the profile list from master's manifest
        run: |
          profiles=$(python3 ci/ci_helpers.py profiles e2e-testing/golden/wgs-manifest.json)
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "Profiles: $profiles" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark pending
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context=parity/wgs -f description="running" \
            -f target_url="$url"
      - name: Acknowledge the /parity-wgs comment
        if: github.event_name == 'issue_comment'
        # The run is already authorized and pending; a failed reply must not
        # skip the tests and leave the status pending.
        continue-on-error: true
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="Whole-genome parity started on \`$SHA\` for @$ACTOR: $url"
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket \
            || echo "::warning::reaction failed"
      - name: Refuse a non-admin /parity-wgs comment
        if: failure() && github.event_name == 'issue_comment' && steps.admin.outcome == 'failure'
        run: |
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="@$ACTOR /parity-wgs is admin-only; ask a maintainer to run it."
      - name: Report a /parity-wgs comment that could not start
        if: failure() && github.event_name == 'issue_comment' && steps.admin.outcome == 'success'
        env:
          # Built in the pr step from API values and fixed text only.
          MSG: ${{ steps.pr.outputs.msg }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$REPO/issues/$PR/comments" \
            -f body="/parity-wgs could not start${MSG:+: $MSG}; see $url"

  build-wheel:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          # No sccache: a PR build.rs could poison entries in master's cache scope.
          sccache: false
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: dist

  # Runs on the self-hosted runner; see _tier-wgs-parity.yml. Its result is a
  # fixed enum read by report, and its result files are data only.
  profile:
    needs: [authorize, build-wheel]
    permissions:
      contents: read
    uses: ./.github/workflows/_tier-wgs-parity.yml
    with:
      ref: ${{ needs.authorize.outputs.sha }}
      profiles: ${{ needs.authorize.outputs.profiles }}

  report:
    needs: [authorize, profile]
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      # Reply on the PR for a /parity-wgs comment.
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr || github.event.issue.number }}
      SHA: ${{ needs.authorize.outputs.sha }}
      # From master's manifest (authorize); the job result is a fixed enum.
      # Result files come from a job that ran PR code: data only, never
      # interpolated into a script.
      PROFILES: ${{ needs.authorize.outputs.profiles }}
      PROFILE_RESULT: ${{ needs.profile.result }}
    steps:
      # The workflow's own ref (master), never the PR: this job holds statuses: write.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          pattern: result-wgs-*
          path: results
      - name: Post statuses
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          mkdir -p results
          python3 ci/ci_helpers.py wgs-statuses --results-dir results \
            --profiles "$PROFILES" --job "$PROFILE_RESULT" \
            > statuses.tsv
          cat statuses.tsv
          failed=0
          while IFS=$'\t' read -r ctx state desc; do
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$state" -f context="$ctx" -f description="$desc" \
              -f target_url="$url" || failed=1
          done < statuses.tsv
          exit "$failed"
      - name: Reply to the /parity-wgs comment
        if: ${{ !cancelled() && github.event_name == 'issue_comment' }}
        run: |
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          want=parity/wgs
          # Descriptions can carry text from a job that ran PR code: keep it
          # inside a code span so it cannot render as markdown or mentions.
          row=$(awk -F'\t' -v c="$want" '$1 == c { print $2 "\t" $3; exit }' statuses.tsv 2>/dev/null || true)
          state=${row%%$'\t'*}
          desc=${row#*$'\t'}
          [ -n "$row" ] || { state=error; desc="no status computed"; }
          body="Whole-genome parity on \`$SHA\`:"
          body+=$'\n'"- \`$want\`: **${state//[^a-z]/}** \`${desc//\`/}\`"
          body+=$'\n\n'"Run: $url"
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body"
