# TEMPORARY: exercises parity-wgs.yml's profile job on runner 4682 before the
# workflow is on master (dispatch/comment workflows only run from master).
# Remove before merge.
name: wgs-probe (temporary, remove before merge)
on:
  push:
    branches: [ci/parity-wgs, probe/wgs-negative]
permissions:
  contents: read
concurrency:
  group: wgs-probe-${{ github.ref }}
  cancel-in-progress: true
env:
  WGS_IMAGE: vepyr-wgs:1
jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          sccache: false
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: dist

  profile:
    needs: build-wheel
    name: wgs (${{ matrix.profile }})
    runs-on: [self-hosted, linux, x64, vepyr-wgs]
    timeout-minutes: 300  # probe: measure, then set the real timeout
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [ensembl, refseq]  # merged verified in run 38110005636
    env:
      PROFILE: ${{ matrix.profile }}
      SCRATCH: /scratch/vepyr-wgs/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      CONTAINER: vepyr-wgs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - name: Clean leftovers from earlier jobs
        run: |
          # A job container that outlived a cancelled or timed-out job.
          docker ps -aq --filter label=vepyr-wgs=1 | xargs -r docker rm -f
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true
          rm -rf "$SCRATCH" && mkdir -p "$SCRATCH"
          res=$(mktemp -d "$RUNNER_TEMP/wgs-res.XXXXXX")
          echo "RES=$res" >> "$GITHUB_ENV"
      - name: Plant a file the cleanup must remove (probe)
        run: touch "$GITHUB_WORKSPACE/planted-by-earlier-job"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: ${{ env.SCRATCH }}/dist
      - id: run
        name: Whole-genome parity in a fresh container
        run: |
          docker image inspect "$WGS_IMAGE" >/dev/null || { echo "::error::image $WGS_IMAGE missing on runner; run ci/wgs-runner/build-image.sh"; exit 3; }
          # No checked-out (PR) code runs on the host: shell only here. The
          # container has not run yet, so dist/ holds only the downloaded wheel.
          shopt -s nullglob
          wheels=("$SCRATCH"/dist/vepyr-*manylinux*x86_64*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one x86_64 wheel, got ${#wheels[@]}"; exit 3; }
          wheel="${wheels[0]}"
          docker run --rm --name "$CONTAINER" --label vepyr-wgs=1 --network bridge \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --memory 56g --memory-swap 56g \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=4g \
            -e DATA_VEPYR_DIR=/data -e HOME=/work -e WORK=/work \
            -v /data/vepyr:/data:ro -v "$SCRATCH":/work:rw -v "$GITHUB_WORKSPACE":/src:ro \
            "$WGS_IMAGE" bash /src/ci/wgs-runner/run-profile.sh "$PROFILE" "/work/dist/$(basename "$wheel")"
      - name: Collect results
        if: always()
        run: |
          if [ -z "${RES:-}" ] || [ ! -d "$RES" ]; then echo "::error::no host results dir"; exit 1; fi
          fail() {  # host-side error result; $SCRATCH is not read
            printf '{"name":"wgs/%s","conclusion":"error","summary":"%s"}\n' "$PROFILE" "$1" > "$RES/result-wgs-$PROFILE.json"
            echo "::error::$1"; exit 1
          }
          # On cancel or timeout the runner kills the docker CLI, not the
          # container: make sure no PR code is still writing to $SCRATCH.
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          left=$(docker ps -aq --filter "name=^${CONTAINER}\$") || fail "cannot list containers"
          [ -z "$left" ] || fail "job container still present"
          # $SCRATCH was written by PR code: drop symlinks and specials first
          # (twice, around the chmod that undoes any unreadable directories).
          find "$SCRATCH" -mindepth 1 \( -type l -o ! -type f ! -type d \) -delete 2>/dev/null || true
          chmod -R u+rwX "$SCRATCH" 2>/dev/null || true
          find "$SCRATCH" -mindepth 1 \( -type l -o ! -type f ! -type d \) -delete 2>/dev/null || true
          real_scratch=$(realpath -e -- "$SCRATCH") || fail "scratch missing"
          take() {  # take SRC DEST MAXBYTES: copy a capped regular file into $RES
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            local real
            # Defence in depth against a symlinked directory component.
            real=$(realpath -e -- "$1") || return 1
            case "$real" in "$real_scratch"/*) ;; *) return 1 ;; esac
            mkdir -p "$(dirname "$2")" && head -c "$3" -- "$real" > "$2"
          }
          take "$SCRATCH/summary.txt" "$RES/summary.txt" 65536 || true
          take "$SCRATCH/run.log" "$RES/reports/run.log" 5242880 || true
          take "$SCRATCH/result.json" "$RES/result-wgs-$PROFILE.json" 16384 \
            || printf '{"name":"wgs/%s","conclusion":"error","summary":"no result written"}\n' "$PROFILE" > "$RES/result-wgs-$PROFILE.json"
          if [ -f "$RES/summary.txt" ]; then mkdir -p "$RES/reports" && cp -- "$RES/summary.txt" "$RES/reports/summary.txt"; fi
          if [ -d "$SCRATCH/out/reports" ] && [ ! -L "$SCRATCH/out/reports" ]; then
            # At most 200 files, 5 MiB each, 200 MiB in total.
            n=0; budget=$((200 * 1024 * 1024))
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              if [ "$n" -gt 200 ] || [ "$budget" -le 0 ]; then break; fi
              cap=$((budget < 5242880 ? budget : 5242880))
              dest="$RES/reports/out/${f#"$SCRATCH/out/reports/"}"
              take "$f" "$dest" "$cap" || continue
              budget=$((budget - $(stat -c %s -- "$dest")))
            done < <(find "$SCRATCH/out/reports" -type f -print0)
          fi
          { echo "### wgs ($PROFILE)"; cat "$RES/summary.txt" 2>/dev/null || echo "did not run"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-wgs-${{ matrix.profile }}
          path: ${{ env.RES }}/result-wgs-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wgs-${{ matrix.profile }}-reports
          path: ${{ env.RES }}/reports
          if-no-files-found: ignore
      - name: Remove scratch, results and workspace
        if: always()
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          chmod -R u+rwX "$SCRATCH" 2>/dev/null || true
          rm -rf "$SCRATCH" ${RES:+"$RES"}
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null || true


  leak-check:
    needs: profile
    if: always() && needs.profile.result != 'skipped'
    runs-on: [self-hosted, linux, x64, vepyr-wgs]
    timeout-minutes: 10
    steps:
      - name: Nothing from the profile job survives
        run: |
          bad=0
          if [ -e "$GITHUB_WORKSPACE/planted-by-earlier-job" ]; then echo "::error::planted file survived"; bad=1; fi
          left=$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 | head -5)
          if [ -n "$left" ]; then echo "::error::workspace not empty: $left"; bad=1; fi
          dirs=$(find /scratch/vepyr-wgs -mindepth 1 -maxdepth 1 -name "${GITHUB_RUN_ID}-*" | head -5)
          if [ -n "$dirs" ]; then echo "::error::scratch left behind: $dirs"; bad=1; fi
          ctr=$(docker ps -aq --filter label=vepyr-wgs=1)
          if [ -n "$ctr" ]; then echo "::error::job container left behind: $ctr"; bad=1; fi
          res=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'wgs-res.*' | head -5)
          if [ -n "$res" ]; then echo "::error::results dir left behind: $res"; bad=1; fi
          [ "$bad" -eq 0 ] && echo "no leaks"
          exit "$bad"
