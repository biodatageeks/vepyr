name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Pre-existing shellcheck findings in publish_to_pypi.yml and
      # version-bump.yml are ignored by message rather than rewritten: those
      # workflows ship releases and are not changed here.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color \
            -ignore 'SC2155:warning:1:8: Declare and assign separately' \
            -ignore 'SC2086:info:15:17: Double quote to prevent globbing' \
            -ignore 'SC2209:warning:(22|25):5: Use var=\$\(command\)'

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `extension-module` feature makes PyO3 skip linking libpython (the
      # interpreter supplies the symbols when the module is imported), which
      # leaves a standalone `cargo test` binary with undefined Python symbols.
      # Build the tests without it so PyO3 links libpython, and expose that
      # library dir to the runtime linker.
      - name: cargo test
        run: |
          libdir="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${libdir}:${LD_LIBRARY_PATH:-}"
          cargo test --no-default-features

  # Cheap checks of the imported porting suite (porting-tests/): no cache or
  # FASTA download. The data suite itself runs in parity-tests.yml / release.
  vep-parity-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: porting-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up bcftools 1.23 / htslib 1.23.1 (the pin in tools/normalize_input)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bcftools
          # `==` is an exact match; `bcftools=1.23` would also accept 1.23.1.
          create-args: >-
            -c conda-forge -c bioconda
            bcftools==1.23
            htslib==1.23.1
          init-shell: bash
          cache-environment: true
      - name: Record the bcftools banner
        shell: bash -el {0}
        run: |
          set -euo pipefail
          bcftools --version | head -2 | tee banner.txt
          {
            echo '### bcftools --version'
            echo '```'
            cat banner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Login shell so the micromamba bcftools 1.23 is first on PATH: the
      # normalize_input tests need exactly that version.
      - name: Runner unit tests
        shell: bash -el {0}
        run: uv run --frozen pytest tools/ -q
      - name: tests/INDEX.csv is current
        run: tools/build_test_index --check
      - name: Every data test matches the VEP pin
        run: tools/check_vep_version
      - name: Data-test inputs are normalised
        shell: bash -el {0}
        run: ./check_normalised_input
      - name: Ledger matches upstream
        run: |
          tools/check_ledger --sweep
          tools/check_ledger --sweep --glob 't/*.pm'
          tools/check_ledger --csv ledger/assertions.csv

  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Install VCF command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix
      - name: Build and test
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}
          uv run pytest -v

  # Windows x64 wheels are published and documented as supported, but until
  # this job existed nothing ever ran the suite on Windows — only the wheel
  # build. Path handling, temp files and link creation all differ there.
  #
  # One interpreter rather than the full matrix: the wheel is abi3, so
  # Windows-specific breakage is generally interpreter-independent, and a
  # five-way matrix on a slower runner is not worth the minutes.
  #
  # bcftools/tabix are not installed (no apt on Windows). Nothing in the suite
  # shells out to them; the tests that want tabix input go through pysam, which
  # is not a dependency and is skipped when missing.
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build and test
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}
          uv run pytest -v

  # Linux arm64 on a native GitHub arm runner, not cross-compiled, so the
  # same host that builds the wheel also runs the suite. One interpreter for
  # the same abi3 reasoning as the Windows job above.
  linux-arm64-tests:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Install VCF command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix
      - name: Build and test
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }}
          uv run pytest -v

  linux:
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist

  # Tier 4 on non-draft PRs and pushes to master. A draft's skipped job is
  # harmless: GitHub never merges drafts, and ready_for_review re-runs CI.
  nfcore:
    needs: linux
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    uses: ./.github/workflows/_tier-nfcore.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  macos:
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-latest' || 'macos-14' }}
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          maturin-version: v1.13.3
          args: --release --out dist --find-interpreter
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-win-${{ matrix.target }}
          path: dist
