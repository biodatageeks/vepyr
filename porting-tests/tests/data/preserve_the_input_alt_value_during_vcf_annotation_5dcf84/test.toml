name = "preserve_the_input_alt_value_during_vcf_annotation_5dcf84"
description = "Fixture covering 11 tests. Compare the complete output body with expected_output.vcf."

[vepyr]
flavour = "merged"
required_contigs = ["chr21"]
everything = true
preserve_record_layout = true
reference_fasta = true

[vep]
