# repository contract — do not add engine SHAs here.
#
# For HF tables, `sha` is the dataset COMMIT on huggingface.co (40 hex).
# For grch38_fasta, `sha` is the sha256 of the UNCOMPRESSED .fa.
# Measured 2026-10-31.

