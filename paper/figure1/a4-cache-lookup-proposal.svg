<title>A4 — Cache lookup</title><desc>Cache build, cache anatomy and cache lookup proposal, using chromosome 22. Lookup shards include ColumnIndex value ranges and OffsetIndex page locations. Lookup example rows and payload values are illustrative. The anatomy chart reports 920 versus 220 position pages for one buffer from Marek's source. Warm and cold are on-disk frequency tiers. Performance data are unchanged.</desc></svg>
