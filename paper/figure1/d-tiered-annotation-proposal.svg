<title>D — Three tiers of annotation (HG002)</title><desc>Three tiers of annotation applied to the GIAB HG002 v4.2.1 genome: the vepyr core cache and plugin caches feed vepyr.annotate(); ad hoc sources are read directly from their URLs by polars-bio and Polars. The funnel counts variants with a predicted loss-of-function consequence in a MANE Select transcript that remain after the filters of each tier; the bars give the share of each variant class in the two most LoF-intolerant gnomAD v4.1 LOEUF deciles. Numbers are read from the Supplementary Data analysis results.</desc></svg>
