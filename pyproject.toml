[project]
name = "vepyr"
version = "0.4.0"
description = "VEP Yielding Performant Results — Python interface for Ensembl VEP annotation in Rust"
readme = "README.md"
authors = [
    { name = "Marek Wiewiórka", email = "marek.wiewiorka@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pyarrow>=18.0", "polars>=1.37.1", "tqdm>=4.60"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings>=0.27",
    "mkdocstrings-python>=1.12",
    # click-to-enlarge for the pre-rendered architecture diagrams
    "mkdocs-glightbox>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "polars-bio>=0.26.0",
    "pre-commit>=4.5.1",
    # parquet-rs writer used by the golden-cache fixtures (tests/cache_metadata.py,
    # tests/data/golden/prepare.py) so shards keep an arrow-rs-readable page index.
    "datafusion>=50.0",
    # figures for the scaling benchmarks
    # (performance-tests/vepyr/scripts/plot_vepyr_worker_scaling.py).
    "matplotlib>=3.8",
    # notebooks/annotate.ipynb, and the Jupyter server an IDE starts for it.
    # These must be declared, not `uv pip install`ed: `uv sync` prunes anything
    # missing from uv.lock, which strands a running server with no kernels.
    # ipywidgets is also user-facing via the `notebook` extra (tqdm.auto bars).
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "ipywidgets>=8.1.8",
]

[tool.maturin]
module-name = "vepyr._core"
python-packages = ["vepyr"]
python-source = "src"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
