[package]
name = "vepyr"
version = "0.10.0"
edition = "2021"

[features]
# Exactly one global allocator is linked (see src/lib.rs). jemalloc takes
# precedence when enabled, except on Windows/MSVC where it is unsupported.
default = ["extension-module", "mimalloc"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
dhat-heap = ["dep:dhat"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# mimalloc stays on v2: v3 segfaults at import on macOS arm64.
mimalloc = { version = "0.1", default-features = false, features = ["v2"], optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
dhat = { version = "0.3", optional = true }
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
arrow = { version = "59.3.2", features = ["pyarrow"] }
datafusion = "=55.2.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde_json = "1"

# The two bio-formats crates must use the same source (tag or rev) as the
# bio-formats pins of bio-function-vep, or cargo resolves two copies and the
# build fails with mismatched types (E0308).
datafusion-bio-function-vep = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", rev = "7b0f9e35d288fa29d7bc767ea2700428a5ee2ffc", features = ["cache-builder"] }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.17.0" }
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.17.0" }

# The symbol table is not needed at runtime (dynamic exports such as PyInit__core
# stay), and dropping it cuts each wheel by ~13% (macOS arm64: 54.3 -> 47.4 MB).
# Native panic backtraces show addresses instead of function names.
[profile.release]
strip = "symbols"

# Published wheels only: publish_to_pypi.yml builds with `--profile dist`.
# `maturin develop`, the CI/parity wheel builds and conda keep `release`.
# Measured on macOS arm64 (biodatageeks/polars-bio#511 for the method): wheel
# 47.4 -> 34.5 MB, annotation 3-5% faster in wall and CPU time on HG002 and
# ClinVar, byte-identical output. The cost is the build: 3.5x longer and a
# single-threaded final link that peaked at 16.2 GB RSS, which is why the Linux
# x86_64 wheel builds on the self-hosted runners and aarch64 adds swap.
# Reproduce a published wheel with `maturin build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
