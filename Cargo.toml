[package]
name = "vepyr"
version = "0.1.0"
edition = "2021"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.28", features = ["abi3-py310"] }

# Arrow interop between Rust and Python (PyArrow)
arrow = { version = "58", features = ["pyarrow"] }

# DataFusion for query execution
datafusion = "=53.0.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde_json = "1"

# Upstream biodatageeks crates
datafusion-bio-function-vep = { path = "../datafusion-bio-functions/datafusion/bio-function-vep", features = ["cache-builder", "lance-cache"] }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.8.0" }
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.8.0" }
