[package]
name = "vepyr"
version = "0.6.0"
edition = "2021"

[features]
# Allocator selection (mirrors polars-bio). Exactly one global allocator is linked;
# see src/lib.rs. mimalloc is on by default; jemalloc is opt-in and takes precedence
# when enabled, except on Windows/MSVC where tikv-jemallocator is unsupported.
#   Build with jemalloc: maturin build --release --no-default-features \
#     --features extension-module,jemalloc
default = ["extension-module", "mimalloc"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
dhat-heap = ["dep:dhat"]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# Global allocators, selected via [features] above (mimalloc default-on, jemalloc
# opt-in). Both optional so exactly one is linked. mimalloc pinned to v2: v3
# segfaults at import on macOS arm64 (per polars-bio). jemalloc is unsupported on
# Windows/MSVC; there the build falls back to mimalloc.
mimalloc = { version = "0.1", default-features = false, features = ["v2"], optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
dhat = { version = "0.3", optional = true }
# PyO3 for Python bindings
pyo3 = { version = "0.28", features = ["abi3-py310"] }

# Arrow interop between Rust and Python (PyArrow)
arrow = { version = "58", features = ["pyarrow"] }

# DataFusion for query execution
datafusion = "=53.0.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde_json = "1"

# bio-functions 44f5954 (#238): typed motif columns are per-consequence lists and
# SWISSPROT/TREMBL typed values use `&` like the CSQ string; supersedes
# bio-functions b145bc6 (#237): the plugin-cache tier ORDER BY is the probe key
# (tier, start, allele_string, match cols) instead of every column, which is what let the
# full-source SpliceAI chr1/chr2 shards build at the default 8 GiB pool (bio-functions#235).
#
# bio-functions dba94e3: regions option for annotate_vep (biodatageeks/datafusion-bio-functions#239, merge commit)
# bio-formats 12016a9 (v1.12.0 + the exon dedup tie-break, biodatageeks/datafusion-bio-formats#246)
# and bio-functions 6476619 (v0.19.2 + the translation_core ORDER BY #224, the unread-column
# drop #225, the bio-formats bump #226, the partial-cache source-type probe #227, which
# reads bio.vep.cache_source_type from the first variation shard present on disk instead of
# the manifest's first entry, so a per-contig download with whole-cache manifests annotates,
# and plugin source verification #228 (vepyr#68): the plugin cache builder hashes each build
# input and its tabix index once under strict/warn/skip, stages every shard until the sources
# are re-checked, and records the provenance under `sources` in the emitted manifest.json;
# #230 makes plugin shard row order reproducible, #231 records the manifest source version,
# and #232 preserves the requested plugin order in the annotation output).
# Together these make a cache build reproducible:
# the exon dedup tie-break is now total, translation_core has a total output ORDER BY instead
# of relying on CoalescePartitionsExec arrival order, and the four context entities no longer
# persist raw_object_json / object_hash / _rn, which no reader projects.
#
# bio-formats v1.11.0 carried each record's INFO and FORMAT key order through
# a read/write round trip; v0.18.0 turned that on for annotation output and
# stopped stripping field metadata from the annotation schema, without which the
# carry reaches the writer unrecognised. v0.19.0 adds the plugin cache-builder
# work: source-level tabix selection for indexed delimited sources, multi-part
# manifests, and registration of the tabix staging slice as headerless. Together
# with the merged header and QUAL work they make vepyr's VCF output
# byte-identical to Ensembl VEP 116.0 on all 22 autosomes of HG002.
# The two MUST move together: bio-function-vep pins its own bio-formats rev, and
# two different revs are two different sources to cargo, so a mismatch compiles
# the formats crates twice and `CacheSourceType` / the VCF writer types then fail
# to cross into `CacheBuilder` (E0308).
# bio-functions 0bf7175 (v0.20.0~2): streaming run pool, workers>1 on the LazyFrame path (#240)
# bio-functions v0.20.1 fast-forwards that pin by three commits: the two release
# commits plus the bio-formats bump to v1.12.1 (#241). bio-formats v1.12.1 adds
# BED3 support and reader-error propagation (#249) on top of the v1.12.0 exon
# dedup tie-break already pinned here.
# The reference form matters as much as the commit: cargo keys a git source on
# its reference, so `tag = "v1.12.1"` and a `rev =` of the same commit are two
# sources. bio-function-vep declares bio-formats by tag, so vepyr declares it the
# same way -- otherwise the formats crates compile twice and the E0308 above returns.
# TEMPORARY: pinned to the head of biodatageeks/datafusion-bio-functions
# `fix/mnv-allele-trim-parity` (vepyr#95 -- same-length alleles are no longer
# trimmed). Re-pin to the MERGE COMMIT once that PR merges, then to the next
# release tag. bio-formats stays declared by tag on both sides, per the note
# above, so the formats crates still resolve to a single source.
datafusion-bio-function-vep = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", rev = "14f8fef67f73e13ab85d78b342d91cad48fd9562", features = ["cache-builder"] }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.12.1" }
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.12.1" }
