[package]
name = "vepyr"
version = "0.2.0"
edition = "2021"

[features]
# Allocator selection (mirrors polars-bio). Exactly one global allocator is linked;
# see src/lib.rs. mimalloc is on by default; jemalloc is opt-in and takes precedence
# when enabled, except on Windows/MSVC where tikv-jemallocator is unsupported.
#   Build with jemalloc: maturin build --release --no-default-features \
#     --features extension-module,jemalloc
default = ["extension-module", "mimalloc"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
dhat-heap = ["dep:dhat"]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# Global allocators, selected via [features] above (mimalloc default-on, jemalloc
# opt-in). Both optional so exactly one is linked. mimalloc pinned to v2: v3
# segfaults at import on macOS arm64 (per polars-bio). jemalloc is unsupported on
# Windows/MSVC; there the build falls back to mimalloc.
mimalloc = { version = "0.1", default-features = false, features = ["v2"], optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
dhat = { version = "0.3", optional = true }
# PyO3 for Python bindings
pyo3 = { version = "0.28", features = ["abi3-py310"] }

# Arrow interop between Rust and Python (PyArrow)
arrow = { version = "58", features = ["pyarrow"] }

# DataFusion for query execution
datafusion = "=53.0.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde_json = "1"

# Upstream biodatageeks crates
#
# TEMPORARILY pinned to unmerged PR revisions for MotifFeature parity work:
#   datafusion-bio-functions#203 — one CSQ entry per overlapping MotifFeature
#   datafusion-bio-formats#224   — extract BindingMatrix stable_id / TF names
# Revert to the released tags (v0.14.0 / v1.8.8) once both land, then bump to
# the releases that contain them.
#
# bio-function-vep points at `integration/motif-parity-116` rather than the PR
# branch itself: that branch is #203 plus a commit moving its own
# datafusion-bio-formats dependency onto the #224 revision. Cargo rejects two
# different specs for one git repository and also refuses a [patch] aimed back
# at the same source, so the transitive pin has to live upstream.
datafusion-bio-function-vep = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", rev = "ea9a01445dd102c26f9420b09e853d172d93fa07", features = ["cache-builder"] }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", rev = "8c3e50ecb7f35a738c3ba0f25edb9c9e5b25b3bb" }
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", rev = "8c3e50ecb7f35a738c3ba0f25edb9c9e5b25b3bb" }
