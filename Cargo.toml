[package]
name = "vepyr"
version = "0.10.0"
edition = "2021"

[features]
# Exactly one global allocator is linked (see src/lib.rs). jemalloc takes
# precedence when enabled, except on Windows/MSVC where it is unsupported.
default = ["extension-module", "mimalloc"]
extension-module = ["pyo3/extension-module"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
dhat-heap = ["dep:dhat"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# mimalloc stays on v2: v3 segfaults at import on macOS arm64.
mimalloc = { version = "0.1", default-features = false, features = ["v2"], optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
dhat = { version = "0.3", optional = true }
pyo3 = { version = "0.28", features = ["abi3-py310"] }
arrow = { version = "58", features = ["pyarrow"] }
datafusion = "=53.0.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde_json = "1"

# The two bio-formats crates must use the same source (tag or rev) as the
# bio-formats pins of bio-function-vep, or cargo resolves two copies and the
# build fails with mismatched types (E0308).
datafusion-bio-function-vep = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", tag = "v0.24.1", features = ["cache-builder"] }
datafusion-bio-format-ensembl-cache = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", rev = "e0379fb28a0d4d74f8da4c9cbd357182361349f9" }
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", rev = "e0379fb28a0d4d74f8da4c9cbd357182361349f9" }
