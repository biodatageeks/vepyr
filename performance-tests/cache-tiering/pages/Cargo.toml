[package]
name = "pages76"
version = "0.1.0"
edition = "2024"

[dependencies]
parquet = { version = "=58.0.0", features = ["arrow", "async", "zstd"] }
arrow-array = "=58.0.0"
arrow-select = "=58.0.0"
arrow-schema = "=58.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures = "0.3"
bytes = "1"

[profile.release]
debug = false
